<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Much Do U Love Me?</title>
    <style>
        :root {
            --bg-color: #ffeef2;
            --primary-pink: #ff6b8b;
            --dark-pink: #d84b6b;
            --text-color: #4a4a4a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 107, 139, 0.15);
            max-width: 450px;
            width: 90%;
            margin-bottom: 30px;
            z-index: 10;
        }

        h1 {
            color: var(--primary-pink);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Slider Styles */
        .slider-container {
            margin: 30px 0;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 15px;
            border-radius: 10px;
            background: #ffd3dd;
            outline: none;
            transition: background 0.3s;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-pink);
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .percentage-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-pink);
            margin: 15px 0 5px;
        }

        .love-message {
            font-style: italic;
            color: #7a7a7a;
            min-height: 50px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Question Section */
        .question-box {
            position: relative;
            min-height: 120px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .yes-btn {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 139, 0.4);
        }

        .yes-btn:hover {
            background-color: var(--dark-pink);
            transform: scale(1.05);
        }

        .no-btn {
            background-color: #e0e0e0;
            color: #666;
            position: relative;
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            color: rgba(255, 107, 139, 0.2);
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 4s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>How Much Do U Love Me? 💖</h1>
        <p>Be honest... measure your love using the slider below!</p>
        
        <div class="slider-container">
            <input type="range" min="1" max="100" value="20" class="slider" id="loveSlider">
            <div class="percentage-display" id="percentText">20%</div>
            <div class="love-message" id="messageText">Just a little bit? 🥺</div>
        </div>
    </div>

    <div class="card question-box">
        <h2 style="color: var(--primary-pink); margin-top: 0;">Do you love me forever? 🤔</h2>
        <div class="btn-container">
            <button class="yes-btn" onclick="celebrate()">YES! 🥰</button>
            <button class="no-btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No 💔</button>
        </div>
    </div>

    <script>
        const slider = document.getElementById('loveSlider');
        const percentText = document.getElementById('percentText');
        const messageText = document.getElementById('messageText');
        const noBtn = document.getElementById('noBtn');

        // Dynamic slider logic
        slider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            let displayVal = val + '%';
            let message = "";

            if (val <= 20) {
                displayVal = val + '%';
                message = "Just a little bit? 🥺";
            } else if (val <= 50) {
                displayVal = (val * 5) + '%';
                message = "Okay, getting better... 🤔";
            } else if (val <= 80) {
                displayVal = (val * 20) + '%';
                message = "More than Netflix & sleep? Wow! 🍕";
            } else if (val < 100) {
                displayVal = (val * 80) + '%';
                message = "Unbelievable amounts of love! 🚀";
            } else {
                displayVal = "10,000% 🔥";
                message = "Error: Love capacity overloaded!!! ❤️✨";
            }

            percentText.innerText = displayVal;
            messageText.innerText = message;
        });

        // "No" button escaping trick
        function moveNoButton() {
            // Get random positions based on screen width/height
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Winning action
        function celebrate() {
            alert("I KNEW IT! I love you way more though! ❤️🎉");
            // Trigger extra floating hearts
            for(let i=0; i<20; i++) {
                setTimeout(createHeart, i * 100);
            }
        }

        // Background decorative hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Create hearts slowly in the background automatically
        setInterval(createHeart, 800);
    </script>
</body>
</html>
